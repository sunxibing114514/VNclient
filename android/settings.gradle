pluginManagement {
    // 动态解析 Flutter SDK 路径,使仓库既能在本地开发机构建,也能在 CI Runner 上构建:
    //   1. flutter build 会在 local.properties 中写入 flutter.sdk=<当前机器路径>;
    //   2. 若文件缺失(例如直接运行 gradlew),回退到 flutter 工具注入的 FLUTTER_ROOT 环境变量;
    //   3. 仍找不到时使用开发机默认路径。
    def flutterSdkPath = {
        def path = null
        def props = new Properties()
        def propsFile = file("local.properties")
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
            path = props.getProperty("flutter.sdk")
        }
        if (path == null) {
            path = providers.environmentVariable("FLUTTER_ROOT").orNull
        }
        if (path == null) {
            path = "/opt/flutter"
        }
        return path
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 9.0 强制启用新版 DSL, 与当前 Flutter Gradle 插件不兼容
    // ("only the new DSL interface will be read");而最新 stable Flutter
    // (3.47)要求 AGP ≥ 8.11.1, 故采用 8.11.1(AGP 8.11 需 Gradle ≥ 8.13)。
    id "com.android.application" version "8.11.1" apply false
    // 最新 stable Flutter(如 3.47)要求 Kotlin Gradle 插件 ≥ 2.2.20。
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
