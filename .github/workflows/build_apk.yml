name: 构建 APK 与源码包 (x86_64 / v8a / v7a)

# 触发条件:
#   1. 推送到 main 分支 — 产出 源码 zip + 三个 APK 工作流产物
#   2. 推送 v* 形式的 tag — 在上述产物基础上发布 GitHub Release
#   3. 手动在工作流页面触发
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 不固定具体版本,使用最新 stable:
  # 项目 Gradle 配置(wrapper 8.14.3 + AGP 8.11.1)要求较新的 Flutter 工具链,
  # Flutter 3.29.x 的 flutter_tools/groovy 与 Gradle 9 不兼容
  # (groovy.xml.QName 在 Gradle 9 内置 Groovy 4 中已移除)。
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 构建 APK 与源码 zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "版本号: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Flutter (最新 stable)
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 说明: NDK 不预装固定版本。Flutter 各版本通过 flutter.ndkVersion
      # 声明其所需 NDK,Gradle 会在许可已接受的 Runner 上自动下载对应版本,
      # 避免预装版本与 Flutter 要求不一致。
      - name: 缓存 Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-${{ runner.os }}-gradle-auto

      - name: 显示 Flutter / Java 版本
        run: |
          flutter --version
          dart --version
          java -version
          ls $ANDROID_HOME/ndk/ || true

      - name: 读取项目依赖
        run: flutter pub get

      - name: 静态分析 (允许失败, 仅提示)
        run: flutter analyze || true

      # 一次编译同时产出三个 ABI 的 APK (--split-per-abi),
      # 相比按矩阵构建三次节省约 2/3 的 CI 时间。
      # 体积优化:
      #   - 图标摇树优化 (默认开启, 不再传 --no-tree-shake-icons)
      #   - R8 代码压缩 + 资源压缩 (android/app/build.gradle release 配置)
      #   - --split-debug-info 分离调试符号
      - name: 构建 Release APK (三个 ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: 整理并重命名 APK
        run: |
          set -euo pipefail
          mkdir -p output
          # --split-per-abi 的输出文件名中 x86_64 带下划线,
          # 其余 ABI (armeabi-v7a / arm64-v8a) 使用原样名称。
          for pair in \
            "armeabi-v7a:VNclient-v${VERSION}-android-armeabi-v7a.apk" \
            "arm64-v8a:VNclient-v${VERSION}-android-arm64-v8a.apk" \
            "x86_64:VNclient-v${VERSION}-android-x86-64.apk"; do
            ABI="${pair%%:*}"
            DEST="${pair##*:}"
            SRC="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            if [ ! -f "$SRC" ]; then
              echo "::error::未找到构建产物 $SRC"
              ls -la build/app/outputs/flutter-apk/ || true
              exit 1
            fi
            cp "$SRC" "output/$DEST"
            ls -la "output/$DEST"
          done
          ls -la output/

      - name: 打包源码 zip
        run: |
          set -euo pipefail
          git archive --format=zip \
            --prefix="vnclientt4-v${VERSION}/" \
            -o "output/VNclient-v${VERSION}-source.zip" HEAD
          unzip -l "output/VNclient-v${VERSION}-source.zip" | head -5
          echo "源码条目数: $(unzip -l output/VNclient-v${VERSION}-source.zip | tail -1)"

      - name: 上传 x86-64 APK
        uses: actions/upload-artifact@v4
        if: github.repository == 'sunxibing114514/vnclientt4'
        with:
          name: VNclient-v${{ env.VERSION }}-android-x86-64.apk
          path: output/VNclient-v${{ env.VERSION }}-android-x86-64.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 arm64-v8a APK
        uses: actions/upload-artifact@v4
        if: github.repository == 'sunxibing114514/vnclientt4'
        with:
          name: VNclient-v${{ env.VERSION }}-android-arm64-v8a.apk
          path: output/VNclient-v${{ env.VERSION }}-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 armeabi-v7a APK
        uses: actions/upload-artifact@v4
        if: github.repository == 'sunxibing114514/vnclientt4'
        with:
          name: VNclient-v${{ env.VERSION }}-android-armeabi-v7a.apk
          path: output/VNclient-v${{ env.VERSION }}-android-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传源码 zip
        uses: actions/upload-artifact@v4
        if: github.repository == 'sunxibing114514/vnclientt4'
        with:
          name: VNclient-v${{ env.VERSION }}-source
          path: output/VNclient-v${{ env.VERSION }}-source.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: 整理发布目录
        run: |
          set -euo pipefail
          mkdir -p staging
          find release-assets -type f \( -name '*.apk' -o -name '*.zip' \) -exec cp {} staging/ \;
          ls -la staging/

      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VNclient ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: staging/*
