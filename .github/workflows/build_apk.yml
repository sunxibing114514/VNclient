name: 构建 APK (v7a / v8a / x86-64) + 源码 zip

# 触发条件:
#   1. 推送 v* 形式的 tag
#   2. 手动在工作流页面触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.29.3'
  JAVA_VERSION: '17'
  NDK_VERSION: '26.3.11579264'
  APP_VERSION: '1.3.6'

jobs:
  build:
    name: 构建 ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target-platform: android-arm
            artifact-name: VNclient-v1.3.6-android-armeabi-v7a.apk
          - abi: arm64-v8a
            target-platform: android-arm64
            artifact-name: VNclient-v1.3.6-android-arm64-v8a.apk
          - abi: x86-64
            target-platform: android-x64
            artifact-name: VNclient-v1.3.6-android-x86-64.apk

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 缓存 Android NDK ${{ env.NDK_VERSION }}
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: 安装 NDK ${{ env.NDK_VERSION }} (缓存未命中时)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          echo "NDK 缓存未命中, 安装 NDK ${{ env.NDK_VERSION }}"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.NDK_VERSION }}" > /dev/null || true

      - name: 显示 Flutter / Java / NDK 版本
        run: |
          flutter --version
          dart --version
          java -version
          ls $ANDROID_HOME/ndk/ || true

      - name: 读取项目依赖
        run: flutter pub get

      - name: 静态分析 (允许失败, 仅提示)
        run: flutter analyze || true

      - name: 构建 ${{ matrix.abi }} Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform ${{ matrix.target-platform }} \
            --split-per-abi \
            --no-tree-shake-icons

      - name: 重命名 APK 输出
        run: |
          set -euo pipefail
          mkdir -p output
          SRC="build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::未找到构建产物 $SRC"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          cp "$SRC" "output/${{ matrix.artifact-name }}"
          ls -la output/

      - name: 上传 APK 到工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: output/${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 30

  bundle-apks:
    name: 打包三个 APK 到 zip
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有 APK 产物
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: false

      - name: 整理 APK 并打包到 zip
        run: |
          set -euo pipefail
          mkdir -p staging
          find apks -type f -name '*.apk' -exec cp {} staging/ \;
          ls -la staging/
          cd staging
          zip -j "../VNclient-v1.3.6-android-apks.zip" \
            VNclient-v1.3.6-android-armeabi-v7a.apk \
            VNclient-v1.3.6-android-arm64-v8a.apk \
            VNclient-v1.3.6-android-x86-64.apk
          cd ..
          ls -la VNclient-v1.3.6-android-apks.zip
          unzip -l VNclient-v1.3.6-android-apks.zip

      - name: 上传 APK 合并 zip 到工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: VNclient-v1.3.6-android-apks
          path: VNclient-v1.3.6-android-apks.zip
          if-no-files-found: error
          retention-days: 30

  source-zip:
    name: 生成源码 zip
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 打包源码 zip (排除构建产物与缓存)
        run: |
          set -euo pipefail
          mkdir -p output
          git archive --format=zip --prefix=VNclient-v1.3.6-src/ -o output/VNclient-v1.3.6-src.zip HEAD
          cp CHANGELOG.md output/CHANGELOG.md || true
          ls -la output/
          unzip -l output/VNclient-v1.3.6-src.zip | head -20

      - name: 上传源码 zip 到工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: VNclient-v1.3.6-src
          path: output/VNclient-v1.3.6-src.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    needs: [bundle-apks, source-zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: 整理发布目录
        run: |
          set -euo pipefail
          mkdir -p staging
          find release-assets -type f \( -name '*.apk' -o -name '*.zip' \) -exec cp {} staging/ \;
          ls -la staging/

      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VNclient ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: staging/*
